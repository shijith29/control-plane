[project]
name = "tenant-control-plane"
version = "0.1.0"
description = "Tenant provisioning control plane: REST API, transactional outbox, idempotent update consumer, worker simulator."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.1",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "aio-pika>=9.5",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "asgi-lifespan>=2.1",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pip-audit>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane", "src/worker"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # flake8-bugbear
    "UP",       # pyupgrade
    "S",        # flake8-bandit (security)
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "SIM",      # simplifications
    "T20",      # no stray print()
]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow unicode arrows/dashes in strings & comments

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S105", "S106"]  # assert, non-crypto random, test passwords
"scripts/**" = ["T20", "S311"]
"src/worker/**" = ["S311"]                      # random is for simulation, not crypto
"src/control_plane/tools/**" = ["T20"]
"migrations/**" = ["E501"]
"docs/diagrams/**" = ["T20", "B905", "E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["control_plane", "worker"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aio_pika.*", "aiormq.*", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- bandit
[tool.bandit]
exclude_dirs = ["tests", ".venv"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
markers = [
    "db: needs Postgres (TEST_DATABASE_URL)",
    "broker: needs RabbitMQ (TEST_RABBITMQ_URL)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["control_plane", "worker"]
branch = true

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
