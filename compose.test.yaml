# Isolated, throw-away stack for `make test` / `make check`.
# Own Postgres + RabbitMQ on tmpfs, no published ports — never touches dev data.
# The credentials below are fixed values for this ephemeral sandbox, not secrets.
name: tenant-control-plane-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    command: ["postgres", "-c", "max_connections=300", "-c", "fsync=off", "-c", "synchronous_commit=off"]
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 60

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: test
      RABBITMQ_DEFAULT_PASS: test
    tmpfs: [/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 60

  tests:
    build:
      context: .
      target: dev
    image: tenant-control-plane:dev
    environment:
      TEST_DATABASE_URL: postgresql+asyncpg://test:test@postgres:5432/test
      TEST_RABBITMQ_URL: amqp://test:test@rabbitmq:5672/
      TEST_RABBITMQ_MGMT_URL: http://test:test@rabbitmq:15672
      REQUIRE_SERVICES: "1"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    command: ["pytest", "--cov"]
